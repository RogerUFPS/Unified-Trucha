  backend:
    build:
      context: ./Backend
      dockerfile: docker/Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,testserver
      CORS_ALLOW_ALL_ORIGINS: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      HOST_URL: http://localhost:3000
#    environment:
#      DEBUG: "True"
#      SECRET_KEY: local-compose-secret-key
#      ALLOWED_HOSTS: localhost,127.0.0.1,backend,testserver
#      CORS_ALLOW_ALL_ORIGINS: "True"
#      HOST_URL: http://localhost:3000
#      DATABASE_NAME: piscicola
#      DATABASE_USER: piscicola
#      DATABASE_PASSWORD: piscicola_local
#      DATABASE_HOST: db
#      DATABASE_PORT: "5432"
#      DATABASE_SSLMODE: disable
#    depends_on:
#      db:
#        condition: service_healthy
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/schema/', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001/api
        NEXT_PUBLIC_API_AUDIT: "false"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001/api
      NEXT_PUBLIC_API_AUDIT: "false"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

